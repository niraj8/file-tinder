<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>file-tinder</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171921; --panel2:#1e2029; --line:#2b2e3a;
    --ink:#e9eaf0; --dim:#8a8fa3; --dimmer:#5c6175;
    --keep:#3ddc97; --trash:#ff5c72; --warn:#ffcf7a;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  body:focus,#root:focus{outline:none}
  kbd{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);
      border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--ink)}
  .muted{color:var(--dim)}
  .tag{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--panel2);
       border:1px solid var(--line);font-size:11px;letter-spacing:.04em;color:var(--dim);
       font-family:var(--mono);text-transform:uppercase}

  .card{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 400px}
  @media (max-width:880px){ .card{grid-template-columns:1fr;grid-template-rows:1fr auto} }

  /* preview */
  .stage{position:relative;min-width:0;min-height:0}
  .prev{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        overflow:hidden;background:repeating-conic-gradient(#15161d 0% 25%,#12131a 0% 50%) 50%/24px 24px}
  .prev img,.prev video,.prev audio{max-width:100%;max-height:100%;object-fit:contain;display:block}
  /* A PDF viewer that takes focus swallows the arrow keys the whole app is driven by.
     reclaimFocus blurs it back, which leaves the preview free to scroll: a wheel needs
     no focus, so there is nothing here to block. */
  .prev iframe{width:100%;height:100%;border:0;background:#fff}
  .prev pre{margin:0;padding:24px;width:100%;height:100%;overflow:auto;font-family:var(--mono);
            font-size:12px;line-height:1.6;color:#c9cddb;white-space:pre-wrap;word-break:break-word}
  .glyph{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--dimmer);padding:24px}
  .glyph .ext{font-family:var(--mono);font-size:52px;font-weight:600;letter-spacing:-.02em;color:var(--dim)}
  .glyph .icon{width:168px;height:168px;object-fit:contain}
  /* With no preview to look at, the name is the whole decision — give it room. */
  .glyph .name{font-family:var(--mono);font-size:15px;line-height:1.6;color:var(--ink);
               max-width:min(560px,80%);text-align:center;word-break:break-word;
               overflow-wrap:anywhere}
  .glyph .note{font-size:12px;max-width:280px;text-align:center;line-height:1.55}

  /* dossier */
  .dossier{border-left:1px solid var(--line);background:var(--panel);display:flex;
           flex-direction:column;min-height:0}
  .dhead{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  .dhead h1{margin:10px 0 0;font-size:16px;font-weight:600;line-height:1.4;
            word-break:break-word;overflow-wrap:anywhere}
  .rename{display:block;width:100%;margin:10px 0 0;padding:6px 8px;font-size:16px;
          font-weight:600;line-height:1.4;font-family:var(--sans);color:var(--ink);
          background:var(--panel2);border:1px solid var(--line);border-radius:6px}
  .rename:focus{outline:none;border-color:var(--keep)}
  .rename.pulse{animation:pulse .15s ease-out}
  @keyframes pulse{from{background:var(--line)}to{background:var(--panel2)}}
  .rows{flex:1;overflow:auto;padding:6px 0;min-height:0}
  .row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:9px 22px;align-items:baseline}
  .row dt{color:var(--dimmer);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
  .row dd{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.5;
          word-break:break-word;overflow-wrap:anywhere}
  .sect{padding:16px 22px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--dimmer);border-top:1px solid var(--line);margin-top:8px}
  .callout{margin:10px 22px;padding:10px 12px;border-radius:7px;font-size:12px;line-height:1.5}
  .callout.sib{background:rgba(255,207,122,.08);border:1px solid rgba(255,207,122,.26);color:var(--warn)}
  .callout.stale{background:rgba(255,92,114,.08);border:1px solid rgba(255,92,114,.26);color:#ffa9b5}
  .callout.err{background:rgba(255,92,114,.14);border:1px solid rgba(255,92,114,.4);color:#ffc2ca}

  /* The legend is the product: two verdicts you read from across the room, and a
     quieter row of tools under them. Sized so the keycap is as readable as the word. */
  .prog{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--dimmer);transition:width .2s ease}
  .fine{margin:2px 0 0;font-size:11px;line-height:1.5;color:var(--dimmer);text-align:center}
  .fine kbd{font-size:10px;padding:1px 5px}

  .acts{border-top:1px solid var(--line);padding:16px 22px;display:grid;gap:10px}
  .verdicts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .act{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 10px;
       border-radius:10px;background:var(--panel2);border:1px solid var(--line);
       font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:-.01em;
       color:var(--ink);cursor:pointer;-webkit-appearance:none;
       transition:background .12s ease,border-color .12s ease}
  .act kbd{color:inherit;font-size:22px;padding:5px 11px;border-radius:7px;
           border-bottom-width:3px;background:rgba(0,0,0,.25)}
  .act:hover{background:var(--line)}
  .act:active{transform:translateY(1px)}
  .act:disabled{opacity:.3;cursor:default;transform:none}
  .act:disabled:hover{background:var(--panel2)}
  /* Verdicts are coloured, tools are not. */
  .act.t{color:var(--trash);border-color:rgba(255,92,114,.3);background:rgba(255,92,114,.07)}
  .act.k{color:var(--keep);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.07)}
  .act.t:hover{background:rgba(255,92,114,.16)}
  .act.k:hover{background:rgba(61,220,151,.16)}
  .tools .act{font-size:15px;font-weight:500;padding:11px 8px;gap:8px;color:var(--dim)}
  .tools .act kbd{font-size:14px;padding:3px 8px;border-bottom-width:2px}
  body.busy .acts{opacity:.45}
  @media (max-width:880px){
    .act{font-size:18px;padding:13px 8px}
    .act kbd{font-size:17px;padding:4px 9px}
    .tools .act{font-size:13px;padding:9px 6px}
    .tools .act kbd{font-size:12px;padding:3px 7px}
  }

  /* The done screen's receipt: what went to the Trash, in case one of them shouldn't have. */
  .receipt{max-width:420px;width:100%;text-align:left;display:grid;gap:6px;
           max-height:34vh;overflow:auto}
  .receipt .line{font-family:var(--mono);font-size:12.5px;color:var(--dim);
                 word-break:break-word;overflow-wrap:anywhere}
  .receipt .sect{border:0;padding:0;margin:0}
  .done-acts{display:grid;grid-template-columns:1fr;gap:10px;width:260px}

  /* centred screens */
  .screen{height:100vh;display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:26px;text-align:center;padding:24px}
  .screen h2{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
  .nums{display:flex;gap:44px;flex-wrap:wrap;justify-content:center}
  .nums b{display:block;font-family:var(--mono);font-size:34px;line-height:1.1}
  .nums span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dimmer)}

  /* The pressed-key indicator. */
  .keycast{position:fixed;left:32px;bottom:32px;z-index:50;display:flex;align-items:center;
           gap:12px;padding:14px 20px 14px 16px;border-radius:14px;pointer-events:none;
           background:rgba(12,13,18,.86);border:1px solid rgba(255,255,255,.14);
           box-shadow:0 18px 44px rgba(0,0,0,.55);opacity:0;transform:translateY(8px);
           transition:opacity .22s ease,transform .22s ease;backdrop-filter:blur(6px)}
  .keycast.on{opacity:1;transform:none;transition-duration:.06s}
  .keycast .cap{font-family:var(--mono);font-size:22px;line-height:1;min-width:44px;
                text-align:center;padding:10px 12px;border-radius:9px;color:var(--ink);
                background:#22242e;border:1px solid #363a48;border-bottom-width:3px}
  .keycast .what{font-size:15px;letter-spacing:.02em;color:var(--dim)}

  /* Says what just happened, and that it can be taken back. Top-left, where a preview
     is least likely to have anything you are still reading; pointer-events:none so it
     never intercepts a click on whatever it does overlap. */
  .toast{position:fixed;top:20px;left:20px;z-index:45;max-width:min(460px,50vw);
         display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:11px;
         pointer-events:none;font-size:14px;line-height:1.4;
         background:rgba(12,13,18,.92);border:1px solid var(--line);
         box-shadow:0 14px 36px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);
         transition:opacity .22s ease,transform .22s ease;backdrop-filter:blur(6px)}
  .toast.on{opacity:1;transform:none;transition-duration:.08s}
  .toast b{font-weight:600;word-break:break-word;overflow-wrap:anywhere}
  .toast .hint{color:var(--dim);white-space:nowrap}
  .toast.trash{border-color:rgba(255,92,114,.4);color:var(--trash)}
  .toast.keep{border-color:rgba(61,220,151,.4);color:var(--keep)}
  .toast.undo{border-color:var(--line);color:var(--ink)}

  .flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:40;transition:opacity .28s}
  .flash.on{opacity:1;transition:opacity .04s}
  .flash.trash{background:radial-gradient(120% 90% at 0% 50%,rgba(255,92,114,.4),transparent 62%)}
  .flash.keep{background:radial-gradient(120% 90% at 100% 50%,rgba(61,220,151,.36),transparent 62%)}
</style>

<div id="root" tabindex="-1"></div>
<div class="flash" id="flash"></div>
<div class="keycast" id="keycast"></div>
<div class="toast" id="toast"></div>

<script type="module">
const root = document.getElementById("root");
const flashEl = document.getElementById("flash");
const keycastEl = document.getElementById("keycast");
const toastEl = document.getElementById("toast");

let queue = [];
let index = 0;
let busy = false;
let editing = false;
/** Whether the standing notice came from a rename, and so dies with the editor. */
let noticeFromRename = false;
let notice = null;
const decisions = new Map();
const undoStack = [];

const current = () => queue[index];

const UNITS = ["KB", "MB", "GB", "TB"];

/** A byte count in the largest unit that keeps it readable. */
function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  let value = bytes, unit = -1;
  while (value >= 1024 && unit < UNITS.length - 1) { value /= 1024; unit++; }
  return `${value < 10 ? value.toFixed(1) : Math.round(value)} ${UNITS[unit]}`;
}

const nowSeconds = () => Date.now() / 1000;

/** How long ago a timestamp was, in the coarsest useful terms. */
function relative(seconds) {
  const days = Math.floor((nowSeconds() - seconds) / 86400);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return `${days} days ago`;
  if (days < 365) return `${Math.round(days / 30)} months ago`;
  return `${(days / 365).toFixed(1)} years ago`;
}

const absolute = (seconds) => new Date(seconds * 1000)
  .toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

/**
 * Whether a file has sat untouched since it arrived. An access time within a couple of
 * minutes of the modification time means nothing ever opened it.
 */
const neverOpened = (file) => Math.abs(file.atime - file.mtime) < 90;

const extensionOf = (name) => {
  const dot = name.lastIndexOf(".");
  return dot <= 0 ? "" : name.slice(dot + 1).toLowerCase();
};

const escapeHtml = (value) => String(value).replace(/[&<>"']/g,
  (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

const fileUrl = (file) => `/f/${encodeURIComponent(file.path)}`;

/** Bytes still undecided. What "nearly done" actually means when the queue is sorted by size. */
const pendingBytes = () => queue.slice(index).reduce((total, file) => total + file.size, 0);

const OPAQUE_NOTE = "No preview a browser can render. The dossier is the whole decision.";

/**
 * The stand-in for a file the browser cannot render: the Finder's own icon for it, and
 * the full name. Between them they are the whole decision, so neither is abbreviated.
 */
const glyphHtml = (file, note) =>
  `<div class="glyph">
     <img class="icon" data-icon src="/icon/${encodeURIComponent(file.path)}" alt="">
     <div class="name">${escapeHtml(file.name)}</div>
     <div class="note">${escapeHtml(note)}</div>
   </div>`;

/** Fall back to the bare extension if the Finder icon could not be read. */
function wireIconFallback(file) {
  const icon = root.querySelector("[data-icon]");
  if (!icon) return;
  icon.addEventListener("error", () => {
    const ext = document.createElement("div");
    ext.className = "ext";
    ext.textContent = `.${extensionOf(file.name) || "?"}`;
    icon.replaceWith(ext);
  }, { once: true });
}

function previewHtml(file) {
  const url = fileUrl(file);
  switch (file.kind) {
    case "image":
    case "heic":  return `<img data-fallback src="${url}" alt="">`;
    case "video": return `<video data-fallback src="${url}" controls muted preload="metadata"></video>`;
    case "audio": return `<audio data-fallback src="${url}" controls></audio>`;
    case "pdf":   return `<iframe data-fallback src="${url}#toolbar=0" title="preview"></iframe>`;
    case "text":  return `<iframe data-fallback src="${url}" title="preview"></iframe>`;
    case "archive": return `<pre id="archive">Reading archive…</pre>`;
    default: return glyphHtml(file, OPAQUE_NOTE);
  }
}

/**
 * Replace a preview element with a glyph if it fails to load. Wired as a listener
 * rather than an inline attribute so filenames containing quotes stay harmless.
 */
function wirePreviewFallback(file) {
  const element = root.querySelector("[data-fallback]");
  if (!element) return;
  element.addEventListener("error", () => {
    const glyph = document.createElement("div");
    glyph.innerHTML = glyphHtml(file, "This preview could not be loaded.");
    element.replaceWith(glyph.firstElementChild);
    wireIconFallback(file);
  }, { once: true });
}

async function fillArchive(file) {
  const target = document.getElementById("archive");
  if (!target) return;
  try {
    const body = await (await fetch(`/api/archive/${encodeURIComponent(file.path)}`)).json();
    if (body.unreadable || body.total === 0) { target.textContent = "Archive could not be read."; return; }
    const hidden = body.total - body.entries.length;
    target.textContent = body.entries.join("\n") + (hidden > 0 ? `\n… and ${hidden} more` : "");
  } catch {
    target.textContent = "Archive could not be read.";
  }
}

function warningsHtml(file) {
  const parts = [];
  if (notice) parts.push(`<div class="callout err">${escapeHtml(notice)}</div>`);
  if (file.siblings.length) {
    const count = file.siblings.length;
    parts.push(`<div class="callout sib">${count} other file${count > 1 ? "s" : ""} share
      this name once format and revision markers are stripped — likely a duplicate or a
      superseded revision.</div>`);
  }
  const idleDays = (nowSeconds() - file.atime) / 86400;
  if (idleDays > 60 && file.size > 5e6) {
    parts.push(`<div class="callout stale">Untouched for ${Math.round(idleDays)} days, and ${
      formatSize(file.size)} large.</div>`);
  }
  return parts.join("");
}

/**
 * One legend button, drawn from the action table. tabindex -1: the keyboard already
 * drives every one of these, and a focusable button would only fight reclaimFocus for
 * the arrow keys.
 */
function act(name, cls, off = false) {
  const { cap, label } = ACTIONS[name];
  return `<button type="button" class="act ${cls}" data-act="${name}" tabindex="-1"${
    off ? " disabled" : ""}>${cap ? `<kbd>${cap}</kbd> ` : ""}${label}</button>`;
}

/**
 * The sibling section, heading included, or nothing at all when there are none. A
 * sibling is only worth locating when it sits somewhere other than this card's own
 * folder — inside one folder the path would be the same line repeated.
 */
function siblingsHtml(file) {
  if (file.siblings.length === 0) return "";
  return `<div class="sect">Possible siblings</div>` + file.siblings
    .map((s) => `<div class="row"><dt>${formatSize(s.size)}</dt><dd>${escapeHtml(s.name)}${
      s.folder === file.folder ? ""
        : `<br><span class="muted">${escapeHtml(s.folder)}</span>`
    }</dd></div>`)
    .join("");
}

function dossierHtml(file) {
  const row = (label, value) => `<div class="row"><dt>${label}</dt><dd>${value}</dd></div>`;
  const opened = neverOpened(file)
    ? `never opened<br><span class="muted">since it landed</span>`
    : `${absolute(file.atime)}<br><span class="muted">${relative(file.atime)}</span>`;

  return `<div class="dossier">
    <div class="dhead">
      <span class="tag">${escapeHtml(extensionOf(file.name)) || "no ext"}</span>
      <span class="tag">${index + 1} of ${queue.length}</span>
      <span class="tag">${formatSize(pendingBytes())} left</span>
      <h1 id="title">${escapeHtml(file.name)}</h1>
    </div>
    <div class="rows">
      ${row("Folder", escapeHtml(file.folder))}
      ${row("Size", formatSize(file.size))}
      ${row("Modified", `${absolute(file.mtime)}<br><span class="muted">${relative(file.mtime)}</span>`)}
      ${row("Opened", opened)}
      <div class="sect">Provenance</div>
      ${row("Downloader", file.quarantine ? escapeHtml(file.quarantine) : `<span class="muted">unknown</span>`)}
      ${row("Source", file.whereFrom[0]
        ? escapeHtml(file.whereFrom[0])
        : `<span class="muted">no where-from recorded</span>`)}
      ${file.whereFrom[1] ? row("Referrer", escapeHtml(file.whereFrom[1])) : ""}
      <div id="siblings">${siblingsHtml(file)}</div>
    </div>
    <div id="warnings">${warningsHtml(file)}</div>
    <div class="acts">
      <div class="prog"><i style="width:${(index / queue.length) * 100}%"></i></div>
      <div class="verdicts">
        ${act("trash", "t")}
        ${act("keep", "k")}
      </div>
      <div class="tools">
        ${act("rename", "r")}
        ${act("open", "o")}
        ${act("undo", "u", undoStack.length === 0)}
      </div>
      <p class="fine">Trash means the macOS Trash. <kbd>U</kbd> puts the last one back.</p>
    </div>
  </div>`;
}

/**
 * Pull focus back out of a preview. An embedded PDF viewer autofocuses itself — a
 * password prompt especially — and from there it swallows every key the app needs.
 */
function reclaimFocus() {
  if (editing) return;
  const active = document.activeElement;
  if (active instanceof HTMLIFrameElement || active instanceof HTMLEmbedElement) {
    active.blur();
  }
  if (document.activeElement === root || document.activeElement === document.body) return;
  root.focus({ preventScroll: true });
}

function render() {
  document.body.classList.toggle("busy", busy);

  if (queue.length === 0) {
    root.innerHTML = `<div class="screen"><h2>Nothing to triage.</h2>
      <p class="muted">No loose files at the top level of these folders.</p></div>`;
    return;
  }
  if (index >= queue.length) { renderDone(); return; }

  const file = current();
  root.innerHTML = `<div class="card">
    <div class="stage"><div class="prev">${previewHtml(file)}</div></div>
    ${dossierHtml(file)}
  </div>`;
  wirePreviewFallback(file);
  wireIconFallback(file);
  reclaimFocus();
  if (file.kind === "archive") void fillArchive(file);
}

function renderDone() {
  let kept = 0, reclaimed = 0;
  const trashedNames = [];
  for (const [path, decision] of decisions) {
    const file = queue.find((f) => f.path === path);
    if (decision === "trash") { trashedNames.push(file?.name ?? path); reclaimed += file?.size ?? 0; }
    else kept++;
  }
  const stat = (value, label, colour) =>
    `<div><b${colour ? ` style="color:${colour}"` : ""}>${value}</b><span>${label}</span></div>`;

  // The last chance to catch a wrong call: undo is gone by here, but the Finder's own
  // Put Back is not. Every name is listed — a truncated list would hide exactly the
  // mistake this is here to catch — and the list scrolls if it has to.
  const receipt = trashedNames.length === 0 ? "" : `<div class="receipt">
    <div class="sect">In the Trash</div>
    ${trashedNames.map((name) => `<div class="line">${escapeHtml(name)}</div>`).join("")}
  </div>`;

  root.innerHTML = `<div class="screen">
    <h2>Queue empty.</h2>
    <div class="nums">
      ${stat(trashedNames.length, "trashed", "var(--trash)")}
      ${stat(kept, "kept", "var(--keep)")}
      ${stat(formatSize(reclaimed), "reclaimed")}
    </div>
    ${receipt}
    ${trashedNames.length === 0 ? "" : `<div class="tools done-acts">
      ${act("openTrash", "o")}
    </div>`}
  </div>`;
}

let toastTimer = null;

/** Announce what just happened, and for how long it can still be taken back. */
function toast(kind, html) {
  toastEl.className = `toast ${kind}`;
  toastEl.innerHTML = html;
  requestAnimationFrame(() => toastEl.classList.add("on"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3400);
}

const UNDO_HINT = `<span class="hint"><kbd>U</kbd> undo</span>`;

function flash(kind) {
  flashEl.className = `flash ${kind}`;
  requestAnimationFrame(() => {
    flashEl.classList.add("on");
    setTimeout(() => flashEl.classList.remove("on"), 90);
  });
}

/**
 * Move the file to the Trash. Returns the trash result, or null if it could not be
 * trashed — in which case a notice explaining why has already been set.
 */
async function trashCurrent(file) {
  const response = await fetch("/api/trash", {
    method: "POST", body: JSON.stringify({ path: file.path }),
  });
  const body = await response.json().catch(() => ({}));

  if (response.status === 410) {
    notice = `${file.name} was already gone — something removed it outside file-tinder.`;
    return null;
  }
  if (!response.ok) {
    notice = `Could not trash ${file.name}: ${body.error || "unknown error"}. It was left in place.`;
    return null;
  }
  if (body.putBack === false) {
    notice = `${file.name} was moved to the Trash by hand, so Finder's Put Back will not work for it.`;
  } else if (body.certain === false) {
    notice = `${file.name} is in the Trash, but its exact name there is uncertain — undo may fail.`;
  }
  return body;
}

/** Apply a decision to the current card and move on. */
async function decide(decision) {
  if (busy || editing || index >= queue.length) return;
  const file = current();
  notice = null;

  if (decision !== "trash") {
    decisions.set(file.path, decision);
    undoStack.push({ index, path: file.path, name: file.name, decision, trashed: null });
    flash(decision);
    if (notice === null) toast("keep", `<b>${escapeHtml(file.name)}</b> kept ${UNDO_HINT}`);
    index++;
    render();
    return;
  }

  busy = true;
  render();
  const trashed = await trashCurrent(file);
  busy = false;

  if (trashed === null) {
    index++;
    render();
    return;
  }

  decisions.set(file.path, decision);
  undoStack.push({ index, path: file.path, name: file.name, decision, trashed });
  flash(decision);
  // A notice here means the trash was odd enough that undo might fail — let it stand
  // alone rather than promising undo in a toast beside it.
  if (notice === null) {
    toast("trash", `<b>${escapeHtml(file.name)}</b> moved to the Trash ${UNDO_HINT}`);
  }
  index++;
  render();
}

/** Reverse the last decision, restoring the file if it was trashed. */
async function undo() {
  if (busy || editing || undoStack.length === 0) return;
  const last = undoStack.pop();
  notice = null;

  if (last.decision === "trash" && last.trashed) {
    busy = true;
    render();
    const response = await fetch("/api/restore", {
      method: "POST",
      body: JSON.stringify({ trashedPath: last.trashed.path, path: last.path }),
    }).catch(() => null);
    busy = false;
    if (!response || !response.ok) {
      notice = `${last.name} could not be restored — it is no longer where it was trashed to.`;
    }
  }

  decisions.delete(last.path);
  index = last.index;
  if (notice === null) {
    toast("undo", `<b>${escapeHtml(last.name)}</b> ${
      last.decision === "trash" ? "is back out of the Trash." : "is up for decision again."}`);
  }
  render();
}

/**
 * Re-render the two parts of the dossier that change without the card changing: the
 * sibling list and the callout strip. Leaves the rest of the card — and any open rename
 * input — untouched.
 */
function patchDossier() {
  const file = current();
  const siblings = document.getElementById("siblings");
  if (siblings) siblings.innerHTML = siblingsHtml(file);
  const warnings = document.getElementById("warnings");
  if (warnings) warnings.innerHTML = warningsHtml(file);
}

/** Swap the filename heading for an input, basename pre-selected. */
function startRename() {
  if (busy || editing || index >= queue.length) return;
  const heading = document.getElementById("title");
  if (!heading) return;

  const name = current().name;
  const input = document.createElement("input");
  input.id = "title";
  input.className = "rename pulse";
  input.value = name;
  input.spellcheck = false;
  heading.replaceWith(input);
  editing = true;

  input.focus();
  // The extension stays editable, just not selected: typing replaces the basename only.
  const dot = name.lastIndexOf(".");
  input.setSelectionRange(0, dot > 0 ? dot : name.length);
  setTimeout(() => input.classList.remove("pulse"), 150);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); void commitRename(input); }
    else if (event.key === "Escape") { event.preventDefault(); closeRename(current().name); }
  });
}

/** Put the heading back, showing `name`, and drop any refusal it was showing. */
function closeRename(name) {
  const input = document.getElementById("title");
  editing = false;
  if (noticeFromRename) {
    notice = null;
    noticeFromRename = false;
    patchDossier();
  }
  if (input instanceof HTMLInputElement) {
    const heading = document.createElement("h1");
    heading.id = "title";
    heading.textContent = name;
    input.replaceWith(heading);
  }
  reclaimFocus();
}

async function commitRename(input) {
  const file = current();
  const wanted = input.value;
  input.disabled = true;
  const response = await fetch("/api/rename", {
    method: "POST", body: JSON.stringify({ path: file.path, newName: wanted }),
  }).catch(() => null);
  const body = await response?.json().catch(() => ({})) ?? {};
  input.disabled = false;

  if (!response?.ok) {
    // Refusals leave the text in place so the name can be fixed rather than retyped.
    notice = body.error ? `Could not rename: ${body.error}.` : "Could not rename that file.";
    noticeFromRename = true;
    patchDossier();
    input.focus();
    return;
  }

  const before = file.name;
  file.name = body.name;
  file.path = body.path;
  /*
   * Only this card's siblings are refreshed. Every other card's list still reflects the
   * old name until the next run — a name heuristic that informs and never acts, so a
   * stale entry costs nothing but a wrong hint.
   */
  file.siblings = body.siblings ?? file.siblings;
  notice = null;
  closeRename(file.name);

  if (extensionOf(before) !== extensionOf(file.name)) {
    // The extension decides the preview, so this one has to be rebuilt from scratch.
    render();
    return;
  }
  /*
   * Otherwise the preview element is left exactly as it is. Its src still points at the
   * old name, which no longer resolves — already-loaded content keeps displaying, but a
   * video seeked after a rename will fail until the card is revisited. Worth it: the
   * alternative is re-downloading the file on every typo fix.
   */
  patchDossier();
}

function openInDefaultApp() {
  if (busy || editing || index >= queue.length) return;
  void fetch("/api/open", { method: "POST", body: JSON.stringify({ path: current().path }) });
}

/** While the rename editor is open only these two mean anything; the rest is typing. */
const KEYCAST_EDITING = {
  Enter: { cap: "\u21a9", label: "Confirm" },
  Escape: { cap: "esc", label: "Cancel" },
};

/** A keydown reduced to the name the tables use: one-character keys are case-blind. */
const keyName = (event) => (event.key.length === 1 ? event.key.toLowerCase() : event.key);

let keycastTimer = null;

function showKey(event) {
  // The same guard the real handler uses. Without it Cmd-R paints "Rename" over a
  // reload — precisely the lie this is meant to avoid telling on camera.
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const entry = editing ? KEYCAST_EDITING[keyName(event)] : BY_KEY.get(keyName(event));
  if (!entry) return;

  keycastEl.innerHTML = `<span class="cap">${escapeHtml(entry.cap)}</span>
    <span class="what">${escapeHtml(entry.label)}</span>`;
  requestAnimationFrame(() => keycastEl.classList.add("on"));
  clearTimeout(keycastTimer);
  keycastTimer = setTimeout(() => keycastEl.classList.remove("on"), 850);
}

/**
 * Every action the card offers, in one place: the key that triggers it, how that key is
 * drawn, and what it does. The keyboard handler, the legend buttons and the press
 * indicator all read this table, so a key cannot come to mean one thing on screen and
 * another in the handler.
 */
const ACTIONS = {
  trash:  { key: "ArrowLeft",  cap: "\u2190", label: "Trash",  run: () => void decide("trash") },
  keep:   { key: "ArrowRight", cap: "\u2192", label: "Keep",   run: () => void decide("keep") },
  rename: { key: "r",          cap: "R",      label: "Rename", run: startRename },
  open:   { key: "o",          cap: "O",      label: "Open",   run: openInDefaultApp },
  undo:   { key: "u",          cap: "U",      label: "Undo",   run: () => void undo() },
  // Keyless: it exists only on the done screen, where there is no card left to drive.
  openTrash: { key: null, cap: "", label: "Open the Trash",
               run: () => void fetch("/api/open-trash", { method: "POST" }) },
};

/** The same actions, found by the key that triggers them. */
const BY_KEY = new Map(Object.values(ACTIONS)
  .filter((action) => action.key !== null)
  .map((action) => [action.key, action]));

// Delegated, so it survives every re-render of the card.
root.addEventListener("click", (event) => {
  const button = event.target.closest(".act");
  if (button && !button.disabled) ACTIONS[button.dataset.act]?.run();
});
// Clicking a button must not pull focus off the root the arrow keys are read from.
root.addEventListener("mousedown", (event) => {
  if (event.target.closest(".act")) event.preventDefault();
});

// Capture phase, so a key still shows while the rename input has focus.
addEventListener("keydown", showKey, true);

addEventListener("keydown", (event) => {
  const target = event.target;
  if (target instanceof HTMLElement &&
      (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const action = BY_KEY.get(keyName(event));
  if (!action) return;
  event.preventDefault();
  action.run();
});

setInterval(reclaimFocus, 250);
addEventListener("focusin", reclaimFocus);

addEventListener("pagehide", () => {
  navigator.sendBeacon("/api/quit", "{}");
});

try {
  const response = await fetch("/api/files");
  queue = await response.json();
  document.title = `file-tinder — ${queue.length} file${queue.length === 1 ? "" : "s"}`;
  render();
} catch (error) {
  root.innerHTML = `<div class="screen"><h2>Could not read the folders.</h2>
    <p class="muted">${escapeHtml(error.message)}</p></div>`;
}
</script>
